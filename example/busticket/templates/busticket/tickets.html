<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Booking</title>
</head>
<body>
    <h2>Ticket booker</h2>
    {% if error %}
     <p style = 'color: red;'>{{ error }}</p>
    {% endif %}
    {% if success %}
    <p style = "color:green;">{{ success }}</p>
    {% endif %}
    <form method = 'post'>
        {% csrf_token %}
        {{form.as_p}}
        <button type = 'submit'>Book Ticket</button>
    </form>
        
</body>
</html>
